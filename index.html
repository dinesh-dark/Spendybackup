<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spend Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b3a8f"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#0f1b3d;--mute:#6b7690;--blue:#1d4ed8;--hero:#0b3a8f;--green:#16a34a;--red:#dc2626;--line:#e3e9f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c30;--ink:#e8eefc;--mute:#93a0bd;--blue:#5b8cff;--hero:#12306b;--line:#22304d}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c30;--ink:#e8eefc;--mute:#93a0bd;--blue:#5b8cff;--hero:#12306b;--line:#22304d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:20px;margin:4px 0 14px}small{color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:18px 16px 14px;margin-bottom:14px}
.hero small{color:#c7d6ff}.big{font-size:32px;font-weight:700;margin:4px 0 10px}
.bar{height:8px;border-radius:8px;background:#ffffff33;overflow:hidden}.bar i{display:block;height:100%;background:#4ade80}
.bar.over i{background:#f87171}
.two{display:flex;justify-content:space-between;margin-top:10px}
.hero input{width:110px;background:#ffffff1f;border:0;color:#fff;border-radius:8px;padding:4px 8px;font:inherit;font-weight:600;text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.tile b{display:block;margin-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.em{font-size:26px;width:38px;text-align:center}.g{flex:1}.g b,.r b{display:block}.r{text-align:right}
.head{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav button,.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer}
.mnav span{font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.chip span{display:block;font-size:24px}.chip.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card))}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.f{display:flex;gap:8px}.f>*{flex:1}
.total{background:color-mix(in srgb,var(--blue) 10%,var(--card));border-radius:12px;padding:12px;margin-top:14px;display:flex;justify-content:space-between;font-weight:700}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.del{background:none;border:0;color:var(--mute);font-size:16px;cursor:pointer}
.up{color:var(--red);font-weight:600}.dn{color:var(--green);font-weight:600}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}.empty{text-align:center;color:var(--mute);padding:28px 8px}
svg text{fill:var(--mute);font-size:9px}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.leg i{width:10px;height:10px;border-radius:3px}.leg b{margin-left:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 0}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:11px;cursor:pointer;padding:4px}
nav button span{display:block;font-size:20px}nav button.on{color:var(--blue);font-weight:600}
.bi{border-bottom:1px solid var(--line);padding:10px 0}.bi:last-child{border:0}.bi .f{margin-top:6px}.bi input,.bi select{padding:8px 10px}.bi.off{opacity:.45}
.upl{display:block;text-align:center;font-size:15px}.warn{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red)}.warn.ok{background:color-mix(in srgb,var(--green) 12%,var(--card));color:var(--green)}
.thumb{max-width:100%;max-height:220px;display:block;margin:10px auto 0;border-radius:10px}
nav .plus{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;margin:-22px auto 0;display:block;box-shadow:0 4px 12px #1d4ed855}
</style></head><body>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<script>
const P=[["Rice","🍚","Grains"],["Dal","🫘","Grains"],["Wheat flour","🌾","Grains"],["Oil","🛢️","Grocery"],["Sugar","🍬","Grocery"],["Salt","🧂","Grocery"],["Tomato","🍅","Vegetables"],["Potato","🥔","Vegetables"],["Onion","🧅","Vegetables"],["Banana","🍌","Fruits"],["Apple","🍎","Fruits"],["Milk","🥛","Dairy"],["Eggs","🥚","Dairy"],["Chicken","🍗","Meat & fish"],["Fish","🐟","Meat & fish"],["Spices","🌶️","Grocery"],["Household","🧴","Household"],["Personal care","🧼","Household"]];
const CC={Vegetables:"#16a34a",Fruits:"#f97316",Grains:"#8b5cf6",Dairy:"#06b6d4",Grocery:"#1d4ed8","Meat & fish":"#ec4899",Household:"#eab308"};
let S=null;try{S=JSON.parse(localStorage.getItem("st"))}catch(e){}
S=S||{budget:25000,items:[]};S.prods=S.prods||[];
const raw=()=>{try{localStorage.setItem("st",JSON.stringify(S))}catch(e){}};
const save=()=>{S.upd=Date.now();raw();if(tok){clearTimeout(timer);timer=setTimeout(sync,2500)}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=n=>"₹"+(+(+n).toFixed(2)).toLocaleString("en-IN");
const df=d=>new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const allP=()=>[...P,...S.prods.map(p=>[p.name,p.emo,p.cat,p.unit])];const emo=n=>(allP().find(p=>p[0].toLowerCase()==String(n).toLowerCase())||[0,"🛒"])[1];
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let v="home",mo=today().slice(0,7),sel=null;
const inMo=m=>S.items.filter(i=>i.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const sum=a=>a.reduce((s,i)=>s+i.total,0);
const row=i=>`<div class="row"><span class="em">${emo(i.name)}</span><div class="g"><b>${esc(i.name)}</b><small>${i.qty} ${i.unit} · ${fm(i.price)}/${i.unit}${i.store?" · "+esc(i.store):""}</small></div><div class="r"><b>${fm(i.total)}</b><small>${df(i.date)}</small></div></div>`;
const shift=d=>{const [y,m]=mo.split("-").map(Number);const n=new Date(y,m-1+d,1);mo=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");go(v)};
const mnav=()=>`<div class="mnav"><button onclick="shift(-1)">‹</button><span>${new Date(mo+"-01T00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</span><button onclick="shift(1)">›</button></div>`;
const empty=t=>`<div class="empty">${t}</div>`;

function home(){const cur=today().slice(0,7),it=inMo(cur),t=sum(it),b=S.budget,left=b-t,p=Math.min(100,b>0?t/b*100:0);
return `<small>Welcome back</small><h1>Your spending</h1>
<div class="hero"><small>This month's spending</small><div class="big">${fm(t)}</div>
<div class="bar ${left<0?"over":""}"><i style="width:${p}%"></i></div>
<div class="two"><div><small>Monthly budget</small><br>₹<input type="number" inputmode="decimal" value="${b}" onchange="S.budget=+this.value||0;save();go('home')" aria-label="Monthly budget"></div>
<div style="text-align:right"><small>${left<0?"Over budget":"Remaining"}</small><br><b>${fm(Math.abs(left))}</b></div></div></div>
<div class="tiles"><button class="tile" onclick="go('add')">➕<b>Add purchase</b><small>Log what you bought</small></button>
<button class="tile" onclick="go('rep')">📊<b>View reports</b><small>Insights &amp; trends</small></button>
<button class="tile" onclick="go('price')">🏷️<b>Price tracker</b><small>See price changes</small></button>
<button class="tile" onclick="go('prod')">🛒<b>My products</b><small>Add custom items</small></button>
<button class="tile" style="grid-column:1/-1" onclick="go('bill')">📷<b>Scan a grocery bill</b><small>Upload a bill photo, check the items, then add them</small></button></div>
<div class="head"><b>Recent purchases</b><button class="link" onclick="go('hist')">View all</button></div>
<div class="card">${S.items.length?[...S.items].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5).map(row).join(""):empty("No purchases yet. Tap + to add your first one.")}</div>${gcard()}`}

function hist(){const it=inMo(mo);
return `<h1>Purchase history</h1>${mnav()}<div class="card"><small>Total this month</small><div style="font-size:22px;font-weight:700">${fm(sum(it))}</div></div>
<div class="card">${it.length?it.map(i=>`<div class="row"><span class="em">${emo(i.name)}</span><div class="g"><b>${esc(i.name)}</b><small>${i.qty} ${i.unit} · ${fm(i.price)}/${i.unit} · ${df(i.date)}${i.store?" · "+esc(i.store):""}${i.pay?" · "+esc(i.pay):""}</small>${i.notes?`<br><small>${esc(i.notes)}</small>`:""}</div><div class="r"><b>${fm(i.total)}</b></div><button class="del" aria-label="Delete" onclick="del(${i.id})">✕</button></div>`).join(""):empty("No purchases in this month.")}</div>`}
function del(id){(S.del=S.del||[]).push(id);S.items=S.items.filter(i=>i.id!=id);save();go("hist")}

function add(){return `<h1>Add purchase</h1><button class="tile" style="width:100%;margin-bottom:12px" onclick="go('bill')">📷<b>Scan a grocery bill instead</b><small>Read all items from a bill photo</small></button><div class="head"><b>Choose a product</b><button class="link" onclick="go('prod')">Add custom product</button></div><div class="chips">${allP().map((p,i)=>`<button class="chip" onclick="pick(${i})"><span>${p[1]}</span>${p[0]}</button>`).join("")}</div>
<div class="card"><label style="margin-top:0">Product</label><input id="nm" placeholder="Pick above or type a name" maxlength="40">
<label>Category</label><select id="ct">${Object.keys(CC).map(c=>`<option>${c}</option>`).join("")}</select>
<label>Store</label><input id="sto" list="stl" maxlength="40" placeholder="e.g. Big Bazaar"><datalist id="stl">${[...new Set(S.items.map(i=>i.store).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
<label>Quantity</label><div class="f"><input id="q" type="number" inputmode="decimal" value="1" min="0" step="any" oninput="tot()"><select id="u"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>pcs</option></select></div>
<label>Price per unit (₹)</label><input id="pr" type="number" inputmode="decimal" min="0" step="any" oninput="tot()" placeholder="e.g. 40">
<label>Date</label><input id="dt" type="date" value="${today()}">
<label>Payment mode</label><select id="pm"><option>Cash</option><option>UPI</option><option>Card</option></select>
<label>Notes (optional)</label><input id="nt" maxlength="80" placeholder="e.g. Fresh and good quality">
<div class="total"><span>Total amount</span><span id="tt">₹0</span></div><div class="err" id="err"></div>
<button class="btn" onclick="addP()">Save purchase</button></div>`}
function pick(i){const p=allP()[i];$("#nm").value=p[0];$("#ct").value=p[2];if(p[3])$("#u").value=p[3];document.querySelectorAll(".chip").forEach((c,j)=>c.classList.toggle("on",j==i))}
function tot(){$("#tt").textContent=fm((+$("#q").value||0)*(+$("#pr").value||0))}
function addP(){const g=id=>$("#"+id).value,name=g("nm").trim(),qty=+g("q"),price=+g("pr");
if(!name||!(qty>0)||g("pr")===""||!(price>=0)||!g("dt")){$("#err").textContent="Enter a product, a quantity above 0, a price and a date.";return}
S.items.push({id:Date.now(),name,cat:g("ct"),qty,unit:g("u"),price,total:qty*price,date:g("dt"),pay:g("pm"),store:g("sto").trim(),notes:g("nt").trim()});save();mo=g("dt").slice(0,7);go("hist")}

// ---------- Bill scan: read a bill photo on the server, let the user check it, then add to spending ----------
let B=null;const UN=["kg","g","L","ml","pcs"];
const opts=(a,x)=>a.map(o=>`<option ${o==x?"selected":""}>${esc(o)}</option>`).join("");
function bill(){const up=`<label class="btn upl" for="bf">📷 ${B&&B.items?"Scan another bill":"Upload or take a photo of the bill"}</label><input id="bf" type="file" accept="image/*,application/pdf" hidden onchange="scan(this.files[0]);this.value=''">`;
if(!B||!B.items)return `<h1>Scan a bill</h1><div class="card"><small>Take a clear photo of the whole bill. The items and amounts are read for you, and nothing is saved until you check them and tap Add.</small>${up}${B&&B.img?`<img class="thumb" src="${B.img}" alt="Bill photo">`:""}${B&&B.busy?`<div class="empty">Reading your bill… this can take up to a minute.</div>`:""}<div class="err">${B&&B.err?esc(B.err):""}</div></div><button class="link" onclick="go('add')">Add a purchase by hand instead</button>`;
return `<h1>Check your bill</h1><div class="card"><small>Fix anything that was read wrong, untick items you don't want, then add them to your spending.</small>${B.img?`<img class="thumb" src="${B.img}" alt="Bill photo">`:""}
<label>Store</label><input maxlength="40" value="${esc(B.store||"")}" placeholder="e.g. Big Bazaar" oninput="B.store=this.value">
<div class="f"><div><label>Date</label><input type="date" value="${B.date}" oninput="B.date=this.value"></div><div><label>Payment mode</label><select onchange="B.pay=this.value">${opts(["Cash","UPI","Card"],B.pay)}</select></div></div></div>
<div class="card"><div class="head"><b>Items on the bill</b><small id="bn"></small></div>${B.items.map((i,k)=>`<div class="bi ${i.on?"":"off"}" id="bi${k}"><div class="f" style="align-items:center"><input type="checkbox" style="width:auto;flex:none" ${i.on?"checked":""} aria-label="Include" onchange="bs(${k},'on',this.checked);$('#bi${k}').classList.toggle('off',!this.checked)"><span class="em" style="flex:none">${emo(i.name)}</span><input maxlength="40" value="${esc(i.name)}" aria-label="Product" oninput="bs(${k},'name',this.value)"><button class="del" style="flex:none" aria-label="Remove" onclick="B.items.splice(${k},1);go('bill')">✕</button></div>
<div class="f"><input type="number" inputmode="decimal" min="0" step="any" value="${i.qty}" aria-label="Quantity" oninput="bs(${k},'qty',+this.value)"><select aria-label="Unit" onchange="bs(${k},'unit',this.value)">${opts(UN,i.unit)}</select><input type="number" inputmode="decimal" min="0" step="any" value="${i.amount}" aria-label="Amount (₹)" placeholder="₹" oninput="bs(${k},'amount',this.value===''?NaN:+this.value)"></div>
<div class="f" style="align-items:center"><select aria-label="Category" onchange="bs(${k},'cat',this.value)">${opts(Object.keys(CC),i.cat)}</select><small id="bu${k}" style="text-align:right"></small></div></div>`).join("")||empty("No items found. Add them below.")}
<button class="link" style="margin-top:10px" onclick="B.items.push({name:'',qty:1,unit:'pcs',amount:NaN,cat:'Grocery',on:true});go('bill')">+ Add a missing item</button></div>
<div class="card"><label style="margin-top:0">Bill total printed on the bill (₹)</label><input type="number" inputmode="decimal" min="0" step="any" value="${B.total||""}" placeholder="Optional, used to double-check" oninput="B.total=+this.value||0;bt()">
<div class="total"><span>Selected items total</span><span id="bsum"></span></div><div id="bchk"></div><div class="err" id="berr"></div>
<button class="btn" id="badd" onclick="addBill()">Add to spending</button><button class="link" style="display:block;margin:12px auto 0" onclick="B=null;go('bill')">Discard this bill</button></div>${up}`}
function bs(k,f,x){B.items[k][f]=x;bt()}
function bt(){if(!B||!B.items||!$("#bsum"))return;const on=B.items.filter(i=>i.on),t=on.reduce((s,i)=>s+(+i.amount||0),0);
B.items.forEach((i,k)=>{const e=$("#bu"+k);if(e)e.textContent=i.qty>0&&i.amount>=0?fm(i.amount/i.qty)+"/"+i.unit:""});
$("#bsum").textContent=fm(t);$("#bn").textContent=on.length+" of "+B.items.length+" selected";$("#badd").textContent="Add "+on.length+" item"+(on.length==1?"":"s")+" to spending";
const d=B.total?t-B.total:0;$("#bchk").innerHTML=!B.total?"":Math.abs(d)<1?`<div class="warn ok">✓ Matches the bill total of ${fm(B.total)}</div>`:`<div class="warn">${d<0?fm(-d)+" less":fm(d)+" more"} than the bill total of ${fm(B.total)}. Check for missed items, discounts or taxes.</div>`}
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const m=1800,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.85))};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"))};im.src=u})}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function scan(f){if(!f)return;const pdf=f.type=="application/pdf";B={busy:true};
if(!navigator.onLine){B.err="You're offline. Connect to the internet to read a bill.";return go("bill")}
if(pdf&&f.size>4e6){B.err="That PDF is too large (max 4 MB).";return go("bill")}
go("bill");let url;try{url=pdf?await b64(f):await shrink(f)}catch(e){B={err:"Couldn't open that file. Try a JPG or PNG photo."};return go("bill")}
B.img=pdf?"":url;go("bill");
try{const r=await fetch("/api/scan-bill",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:pdf?"application/pdf":"image/jpeg",data:url.split(",")[1],products:allP().map(p=>p[0])})});
const j=await r.json().catch(()=>({error:"Could not read the bill. Try again."}));if(!r.ok||j.error)throw new Error(j.error||"Could not read the bill. Try again.");
B={img:B.img,store:j.store,date:j.date||today(),pay:j.pay||"Cash",total:j.total,items:j.items.map(i=>({...i,on:true}))}}
catch(e){B={img:B.img,err:e.message}}if(v=="bill"){go("bill");bt()}}
function addBill(){const on=B.items.filter(i=>i.on);
if(!on.length){$("#berr").textContent="Select at least one item to add.";return}
if(!B.date){$("#berr").textContent="Enter the bill date.";return}
if(on.some(i=>!String(i.name).trim()||!(i.qty>0)||!(i.amount>=0))){$("#berr").textContent="Each selected item needs a name, a quantity above 0 and an amount.";return}
const id=Date.now();on.forEach((i,k)=>S.items.push({id:id+k,name:i.name.trim(),cat:i.cat,qty:i.qty,unit:i.unit,price:i.amount/i.qty,total:+i.amount,date:B.date,pay:B.pay,store:(B.store||"").trim(),notes:"From scanned bill"}));
save();mo=B.date.slice(0,7);B=null;go("hist")}

const SC=["#1d4ed8","#16a34a","#f97316","#8b5cf6","#ec4899","#06b6d4"];let stf="all",curSt=[];
const nz=i=>i.unit=="g"?{p:i.price*1000,u:"kg"}:i.unit=="ml"?{p:i.price*1000,u:"L"}:{p:i.price,u:i.unit};
const sn=i=>i.store||"Unknown store";
function pf(k){stf=k<0?"all":curSt[k];go("price")}
function price(){const names=[...new Set(S.items.map(i=>i.name))].sort();
if(!names.length)return `<h1>Price tracker</h1>${empty("Add a few purchases and you'll see how prices change over time and by store.")}`;
if(!names.includes(sel))sel=names[0];
const raw=S.items.filter(i=>i.name==sel).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id),u=nz(raw[raw.length-1]).u;
const it=raw.map(i=>({...i,...nz(i)})).filter(i=>i.u==u),stores=[...new Set(it.map(sn))];curSt=stores;
if(!stores.includes(stf))stf="all";
const shown=stf=="all"?stores:[stf],pts=it.filter(i=>shown.includes(sn(i))),last=pts[pts.length-1],prev=pts[pts.length-2];
const ps=pts.map(i=>i.p),mx=Math.max(...ps),mn=Math.min(...ps),avg=ps.reduce((a,b)=>a+b,0)/ps.length;
const ch=prev&&prev.p?(last.p-prev.p)/prev.p*100:null;
const t0=+new Date(pts[0].date),t1=+new Date(last.date),rg=mx-mn||1,X=d=>t1==t0?160:36+(new Date(d)-t0)/(t1-t0)*250,Y=p=>92-(p-mn)/rg*66;
const svg=`<svg viewBox="0 0 310 125" width="100%" role="img" aria-label="Price history by store"><text x="30" y="${Y(mx)+3}" text-anchor="end">${+mx.toFixed(1)}</text><text x="30" y="${Y(mn)+3}" text-anchor="end">${+mn.toFixed(1)}</text><line x1="34" x2="300" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--line)"/><line x1="34" x2="300" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)"/>${stores.filter(x=>shown.includes(x)).map(x=>{const c=SC[stores.indexOf(x)%6],a=pts.filter(i=>sn(i)==x);return (a.length>1?`<polyline points="${a.map(i=>X(i.date)+","+Y(i.p)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.5"/>`:"")+a.map(i=>`<circle cx="${X(i.date)}" cy="${Y(i.p)}" r="3.5" fill="${c}"><title>${esc(x)} · ${df(i.date)} · ${fm(i.p)}/${u}</title></circle>`).join("")}).join("")}<text x="36" y="118">${df(pts[0].date)}</text><text x="300" y="118" text-anchor="end">${df(last.date)}</text></svg>`;
const st=stores.map(x=>{const a=it.filter(i=>sn(i)==x);return{s:x,l:a[a.length-1].p,avg:a.reduce((q,i)=>q+i.p,0)/a.length,lo:Math.min(...a.map(i=>i.p)),n:a.length}}).sort((a,b)=>a.l-b.l);
return `<h1>Price tracker</h1><select onchange="sel=this.value;stf='all';go('price')" aria-label="Product">${names.map(n=>`<option ${n==sel?"selected":""}>${esc(n)}</option>`).join("")}</select>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0"><button class="pill ${stf=="all"?"on":""}" onclick="pf(-1)">All stores</button>${stores.map((x,k)=>`<button class="pill ${stf==x?"on":""}" onclick="pf(${k})">${esc(x)}</button>`).join("")}</div>
<div class="card"><div class="head"><span style="font-size:30px">${emo(sel)}</span>${ch===null?"":`<span class="${ch>0?"up":"dn"}">${ch>0?"▲ +":"▼ "}${ch.toFixed(1)}% vs previous buy</span>`}</div>
<div class="two"><div><small>Latest</small><br><b>${fm(last.p)}/${u}</b></div><div><small>Lowest</small><br><b>${fm(mn)}</b></div><div><small>Average</small><br><b>${fm(avg)}</b></div><div style="text-align:right"><small>Highest</small><br><b>${fm(mx)}</b></div></div></div>
<div class="card"><b>Price per ${u}</b>${pts.length>1?svg:empty("Buy this again to see the price graph.")}${stores.length>1&&stf=="all"?`<div style="display:flex;gap:12px;flex-wrap:wrap">${stores.map((x,k)=>`<div class="leg"><i style="background:${SC[k%6]}"></i>${esc(x)}</div>`).join("")}</div>`:""}</div>
<div class="card"><b>Store comparison</b> <small>latest price per ${u}</small>${stores.length>1?st.map((x,k)=>`<div class="row"><i style="width:10px;height:10px;border-radius:3px;background:${SC[stores.indexOf(x.s)%6]}"></i><div class="g"><b>${esc(x.s)}</b><small>Avg ${fm(x.avg)} · Low ${fm(x.lo)} · ${x.n} buy${x.n>1?"s":""}</small></div><div class="r"><b>${fm(x.l)}</b><small class="${k?"up":"dn"}">${k?"+"+fm(x.l-st[0].l)+" vs cheapest":"Cheapest"}</small></div></div>`).join(""):empty("Log "+esc(sel)+" from another store to compare prices.")}</div>
<div class="card"><b>Previous purchases</b>${[...pts].reverse().map(i=>`<div class="row"><div class="g">${df(i.date)}<br><small>${esc(sn(i))}</small></div><b>${fm(i.p)}/${u}</b></div>`).join("")}</div>`}

function prod(){return `<h1>My products</h1><div class="card"><label style="margin-top:0">Product name</label><input id="pn" maxlength="40" placeholder="e.g. Idli batter">
<div class="f"><div><label>Emoji</label><input id="pe" value="🛒" maxlength="4"></div><div><label>Default unit</label><select id="pu"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>pcs</option></select></div></div>
<label>Category</label><select id="pc">${Object.keys(CC).map(c=>`<option>${c}</option>`).join("")}</select><div class="err" id="perr"></div><button class="btn" onclick="addProd()">Save product</button></div>
<div class="card"><b>Your custom products</b>${S.prods.length?S.prods.map((p,k)=>`<div class="row"><span class="em">${esc(p.emo)}</span><div class="g"><b>${esc(p.name)}</b><small>${p.cat} · per ${p.unit}</small></div><button class="del" aria-label="Delete" onclick="delProd(${k})">✕</button></div>`).join(""):empty("No custom products yet. Add one above and it shows up when you add a purchase.")}</div>
<button class="link" onclick="go('add')">Back to add purchase</button>`}
function addProd(){const n=$("#pn").value.trim();if(!n){$("#perr").textContent="Enter a product name.";return}
if(allP().some(p=>p[0].toLowerCase()==n.toLowerCase())){$("#perr").textContent="That product is already in your list.";return}
S.pdel=(S.pdel||[]).filter(x=>x!=n.toLowerCase());S.prods.push({name:n,emo:$("#pe").value.trim()||"🛒",cat:$("#pc").value,unit:$("#pu").value});save();go("prod")}
function delProd(k){(S.pdel=S.pdel||[]).push(S.prods[k].name.toLowerCase());S.prods.splice(k,1);save();go("prod")}

function rep(){const it=inMo(mo),t=sum(it);
if(!it.length)return `<h1>Reports</h1>${mnav()}${empty("No purchases in this month yet.")}`;
const by={};it.forEach(i=>by[i.cat]=(by[i.cat]||0)+i.total);const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
const C=2*Math.PI*40;let acc=0;
const arcs=cats.map(([c,a])=>{const l=a/t*C,s=`<circle cx="60" cy="60" r="40" fill="none" stroke="${CC[c]||"#888"}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;acc+=l;return s}).join("");
const days=[];for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);days.push(new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))}
const dv=days.map(d=>sum(S.items.filter(i=>i.date==d))),mx=Math.max(...dv,1);
const bars=dv.map((x,k)=>{const h=x/mx*80;return `<rect x="${12+k*40}" y="${95-h}" width="24" height="${h}" rx="4" fill="var(--blue)"/><text x="${24+k*40}" y="108" text-anchor="middle">${days[k].slice(8)}</text>`}).join("");
return `<h1>Reports</h1>${mnav()}<div class="card"><div class="f" style="align-items:center"><svg viewBox="0 0 120 120" width="120" style="flex:none" role="img" aria-label="Spending by category">${arcs}<text x="60" y="58" text-anchor="middle">Total</text><text x="60" y="70" text-anchor="middle" style="font-weight:700;fill:var(--ink);font-size:10px">${fm(t)}</text></svg>
<div>${cats.map(([c,a])=>`<div class="leg"><i style="background:${CC[c]||"#888"}"></i>${c}<b>${fm(a)}</b></div>`).join("")}</div></div></div>
<div class="card"><b>Last 7 days</b><svg viewBox="0 0 290 115" width="100%" role="img" aria-label="Daily spending">${bars}</svg></div>`}

// ---------- Google Drive sync (stores one JSON file in this app's hidden Drive app-data folder) ----------
const CLIENT_ID="386974473840-bhnhm2qv91iq87c3lt78hp8b3gs2tp61.apps.googleusercontent.com",FN="spend-tracker.json";
let tok=null,tc=null,timer=null;
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const cfg=()=>!CLIENT_ID.startsWith("PASTE");
let sst=!cfg()?"Not set up yet. Add your Google client ID (see README).":ls("gd")?"Reconnecting…":"Not connected. Sign in to back up to your Google Drive.";
const setSt=t=>{sst=t;const e=$("#gst");if(e)e.textContent=t};
const gcard=()=>`<div class="card"><div class="head"><b>Google Drive backup</b>${tok?`<button class="link" onclick="sync()">Sync now</button>`:`<button class="link" onclick="gIn()">${ls("gd")?"Reconnect":"Sign in"}</button>`}</div><small id="gst">${esc(sst)}</small></div>`;
function merge(a,b){const del=new Set([...(a.del||[]),...(b.del||[])]),pd=new Set([...(a.pdel||[]),...(b.pdel||[])]),m=new Map(),pm=new Map();
[...(b.items||[]),...(a.items||[])].forEach(i=>m.set(i.id,i));[...(b.prods||[]),...(a.prods||[])].forEach(p=>pm.set(p.name.toLowerCase(),p));
return{budget:(a.upd||0)>=(b.upd||0)?a.budget:b.budget,items:[...m.values()].filter(i=>!del.has(i.id)),prods:[...pm.values()].filter(p=>!pd.has(p.name.toLowerCase())),del:[...del],pdel:[...pd],upd:Math.max(a.upd||0,b.upd||0)}}
function gInit(){if(tc)return true;if(!cfg()||!(window.google&&google.accounts&&google.accounts.oauth2))return false;
tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.appdata",
callback:r=>{if(r&&r.access_token){tok=r.access_token;try{localStorage.setItem("gd","1")}catch(e){}if(v=="home")go("home");sync()}else setSt("Sign-in failed. Try again.")},
error_callback:()=>setSt("Sign-in was cancelled or blocked. Tap Reconnect to try again.")});return true}
function gIn(){if(!cfg()){setSt("Add your Google client ID in index.html first (see README).");return}
if(!gInit()){setSt("Google sign-in is still loading. Check your connection and try again.");return}tc.requestAccessToken()}
async function dr(url,o={}){const r=await fetch(url,{...o,headers:{Authorization:"Bearer "+tok,...(o.headers||{})}});if(r.status==401){tok=null;throw new Error("expired")}if(!r.ok)throw new Error("Drive "+r.status);return r}
async function sync(){if(!tok)return;setSt("Syncing…");
try{const q=encodeURIComponent("name='"+FN+"'");
const l=await(await dr("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+"&fields=files(id)")).json();
const id=l.files[0]&&l.files[0].id;
if(id){const rm=await(await dr("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media")).json();S=merge(S,rm);S.prods=S.prods||[];raw()}
const body=JSON.stringify(S);
if(id)await dr("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body});
else{const b="ss"+Date.now(),mp=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:FN,parents:["appDataFolder"]})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
await dr("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp})}
setSt("Synced at "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));if(v=="home"||v=="hist")go(v)}
catch(e){setSt(e.message=="expired"?"Session expired. Tap Reconnect.":"Sync failed. Check your connection and tap Sync now.");if(v=="home")go("home");setSt(sst)}}
addEventListener("load",()=>{if(ls("gd")&&gInit())tc.requestAccessToken({prompt:"none"});if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})});

const V={home,hist,add,price,rep,prod,bill};
const N=[["home","🏠","Home"],["hist","🧾","History"],["add"],["price","🏷️","Prices"],["rep","📊","Reports"]];
function go(x){v=x;$("#app").innerHTML=V[x]();$("#nav").innerHTML=N.map(n=>n[1]?`<button class="${n[0]==v?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`:`<button class="plus" aria-label="Add purchase" onclick="go('add')">+</button>`).join("");window.scrollTo(0,0);if(x=="bill")bt()}
go("home");
</script></body></html>
